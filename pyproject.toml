[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "reki-vla"
version = "0.1.0"
description = "REKI: a vision-language-action model with register tokens in the action expert"
readme = "PYPI.md"
license = "MIT AND Apache-2.0"
authors = [{ name = "Kyutai" }]
requires-python = ">=3.12,<3.13"
keywords = ["robotics", "vision-language-action", "vla", "flow-matching", "lerobot"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Environment :: GPU :: NVIDIA CUDA :: 12",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "torchcodec==0.10.0",
    "torch==2.10.0",
    "torchvision==0.25.0",
    "accelerate",
    "fire",
    "flash-linear-attention==0.4.2",
    "scipy",
    "transformers==5.3.0",
    "fsspec",
    "tqdm",
    "numpy",
    "pyarrow",
    "huggingface_hub",
    "pillow",
    "imageio",
    "safetensors",
    "pyyaml",
    "grpcio",
]

[project.urls]
Homepage = "https://kyutai.org/reki"
Repository = "https://github.com/kyutai-labs/reki"
Models = "https://huggingface.co/collections/kyutai/reki-6ac371366b3da8cdece73ce2"

[tool.setuptools.packages.find]
where = ["."]
include = ["reki*"]

[tool.pytest.ini_options]
pythonpath = [".", "launchers"]
addopts = "--strict-markers"
markers = [
    "cpu: pure logic, no downloads",
    "hf: fetches the Qwen3.5 processor/config from the HF hub",
    "gpu: needs a GPU",
]

[tool.ruff.lint]
ignore = ["E731"]
extend-select = ["I"]

[tool.ruff.lint.isort]
# the plugin package lives in lerobot_plugin/, so ruff cannot infer it from the folder name
known-first-party = ["reki", "lerobot_policy_reki"]

[tool.ruff]
line-length = 100

[tool.pyright]
# typings/lerobot_policy_reki links lerobot_plugin/: pyright cannot follow the package-dir mapping
extraPaths = ["scripts", "scripts/data", "launchers"]
useLibraryCodeForTypes = false
reportTypedDictNotRequiredAccess = false
reportMissingParameterType = true

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["linux-64"]

[tool.pixi.pypi-dependencies]
reki-vla = { path = ".", editable = true }
lerobot_policy_reki = { path = "lerobot_plugin", editable = true }
# Tested LeRobot release for training, eval and deployment; inference needs none.
lerobot = { version = "==0.5.1", extras = ["async"] }

[tool.pixi.activation.env]
# Per-env lib dir via $CONDA_PREFIX so each env's lib/ (e.g. the sim env's
# libOSMesa.so for headless MuJoCo) lands on LD_LIBRARY_PATH.
LD_LIBRARY_PATH = "$CONDA_PREFIX/lib:$LD_LIBRARY_PATH"

# Site paths from the untracked .env (template: .env.example); datasets and runs
# default to <repo>/storage/ when unset.
[tool.pixi.activation]
scripts = ["scripts/load_env.sh"]

[tool.pixi.dependencies]
ffmpeg = ">=7,<8"

[tool.pixi.feature.sim.dependencies]
# Required at build-time for hf-egl-probe (transitive of libero), which has
# no prebuilt wheel for linux-64 + py3.12 and is compiled from source.
# cmake pinned to <4: hf-egl-probe's CMakeLists.txt declares
# cmake_minimum_required(<3.5), which CMake 4 removed support for.
cmake = ">=3.20,<4"
make = "*"
# OSMesa (CPU OpenGL) for headless MuJoCo rendering. Pinned ==25.0.5: later
# conda-forge builds ship no libOSMesa.so.
mesalib = "==25.0.5"

[tool.pixi.feature.sim.pypi-dependencies]
# The PyPI libero package is the huggingface/lerobot-libero fork.
libero = "*"
mujoco = "==3.3.2"
PyOpenGL = "*"
PyOpenGL-accelerate = "*"

# sim-plus: LIBERO-Plus eval deps. The clone is NOT a pixi editable (that pins an
# absolute path into the lock); launchers/eval_protocols.py puts the clone
# on PYTHONPATH. These are its runtime deps (its own install_requires is empty).
[tool.pixi.feature.sim-plus.dependencies]
# OSMesa + libMagickWand (for `wand`) from conda-forge; mesalib pinned as in `sim`.
mesalib = "==25.0.5"
imagemagick = "*"
# egl-probe==1.0.2 (transitive of robosuite/robomimic) builds from source; its
# CMakeLists declares cmake_minimum_required(<3.5), removed in CMake 4 → pin <4
# (same reason the `sim` feature pins cmake). make is the build backend.
cmake = ">=3.20,<4"
make = "*"

[tool.pixi.feature.sim-plus.pypi-dependencies]
bddl = "==1.0.1"
robosuite = "==1.4.0"
robomimic = "==0.2.0"
gym = "==0.25.2"
# bddl 1.0.1 imports `from future.utils import with_metaclass` but its
# install_requires doesn't enforce it, so we declare it ourselves.
future = "==0.18.2"
# LIBERO-Plus runtime deps (extra_requirements.txt + imports in libero/libero/envs/).
easydict = "*"
scikit-image = "*"
wand = "*"
mujoco = "==3.3.2"
PyOpenGL = "*"
PyOpenGL-accelerate = "*"
# torch and transformers come from [project].dependencies.

[tool.pixi.tasks]
# Uses every visible GPU (multi-GPU when more than one); bf16 is set in train.py.
train = "accelerate launch scripts/train.py"
# Lint, format check, typing, CPU tests and Markdown links. Rewrites nothing.
check = """ruff check --extend-select I reki lerobot_plugin scripts tests launchers \
  && ruff format --check reki lerobot_plugin scripts tests launchers \
  && python -m pyright reki lerobot_plugin tests scripts launchers \
  && pytest -m cpu tests \
  && python scripts/check_links.py"""

[tool.pixi.feature.launch.pypi-dependencies]
# SLURM launchers in launchers/ (submit time only; kept out of the sim envs).
launcheon = { git = "https://github.com/kyutai-labs/launcheon", tag = "v1.0" }
rich = "*"

[tool.pixi.feature.dev.pypi-dependencies]
# Lint, typing and tests (`pixi run check`).
ruff = "==0.15.17"
pyright = "==1.1.398"
pytest = "*"

[tool.pixi.environments]
default = ["launch", "dev"]
sim = ["sim"]
sim-plus = ["sim-plus"]

name: Run Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: pre-commit/action@v3.0.1

  tests:
    runs-on: ubuntu-latest
    needs: pre-commit
    steps:
    - uses: actions/checkout@v4
    - name: Free disk space (the env is ~9 GB)
      run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
    - uses: prefix-dev/setup-pixi@v0.8.14
      with:
        frozen: true
    - run: pixi run python -m pyright reki lerobot_plugin tests scripts launchers
    - run: pixi run pytest -m cpu tests

# SFT base: fields shared by every benchmark. launchers/sft.py, sft_3n.py and sft_4n.py add the
# per-benchmark ones (dataset, steps, warm-start, mirror, state MLPs, crop/scale aug). See
# docs/training.md.
vlm_model_id: Qwen/Qwen3.5-2B
chunk_duration_s: 1.0
max_epochs_per_dataset: 100
video_backend: torchcodec
batch_size: 30
num_workers: 12
lr: 0.0001
min_lr: 2.0e-06
weight_decay: 1.0e-08
lr_schedule: wsd
decay_steps: 5000
ema_decay: 0.999
max_text_tokens: 30000
train_vision_blocks: 4
backbone_lr_scale: 0.3
gradient_checkpointing: true
image_size: 448
aug_color_jitter: 0.2
flow_draws: 8
flow_loss_dof_balanced: true
action_expert_hidden_size: 768
action_expert_intermediate_size: 3072
action_expert_num_layers: 10
action_expert_num_heads: 12
state_encoding: adaln
unify_ee_euler_rotation: true
history_k: 3
max_cameras: 4
camera_dropout_prob: 0.2
shuffle_cameras: true
action_expert_num_registers: 32
ddp_find_unused_parameters: true
ddp_bucket_cap_mb: 256
optimizer_master_weights: true
use_speed_metadata: true
save_steps: 5000
logging_steps: 20
